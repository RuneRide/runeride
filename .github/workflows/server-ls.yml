# SPDX-License-Identifier: EUPL-1.2
# Diagnostic : liste un dossier du serveur o2switch par FTPS (fichiers cachés compris), avec le compte de déploiement.
# Lancer : gh workflow run server-ls.yml --repo RuneRide/runeride -f path=.
name: Diagnostic serveur (liste FTP)

on:
  workflow_dispatch:
    inputs:
      path:
        description: "Dossier relatif au compte FTP (~/app)"
        default: "."
      chmod:
        description: "Optionnel : commande SITE CHMOD, par exemple « 600 .env »"
        default: ""

permissions:
  contents: read

jobs:
  ls:
    runs-on: ubuntu-latest
    steps:
      - name: Lister
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          TARGET: ${{ inputs.path }}
          CHMOD: ${{ inputs.chmod }}
        run: |
          set -euo pipefail
          if [ -n "$CHMOD" ]; then
            printf 'user = "%s:%s"\nssl-reqd\nurl = "ftp://%s/"\nlist-only\nquote = "SITE CHMOD %s"\n' "$FTP_USERNAME" "$FTP_PASSWORD" "$FTP_SERVER" "$CHMOD" | curl -fsS -K - >/dev/null
            echo "SITE CHMOD $CHMOD exécuté"
          fi
          printf 'user = "%s:%s"\nssl-reqd\nurl = "ftp://%s/%s/"\nrequest = "LIST -a"\n' "$FTP_USERNAME" "$FTP_PASSWORD" "$FTP_SERVER" "$TARGET" | curl -fsS -K -
