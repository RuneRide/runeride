# SPDX-License-Identifier: EUPL-1.2
# Teste puis déploie l'application (PWA + API PHP) vers app.runeride.fr sur o2switch, par FTPS.
# Secrets du dépôt, créés par ops/app-setup.sh : FTP_SERVER, FTP_USERNAME, FTP_PASSWORD.
# Jamais déployés : .env, storage/ (clé JWT), tests. Ils sont créés une fois sur le serveur (ops/app-provision.sh).
name: Déploiement app.runeride.fr

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/deploy-app.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-app
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@2.31.1
        with:
          php-version: '8.3'
          extensions: pdo, curl, openssl, sodium
          tools: composer:v2
      - run: composer install --prefer-dist --no-progress
      - name: Tests (ceux qui demandent MariaDB sont ignorés sans RUNERIDE_TEST_DSN)
        run: vendor/bin/phpunit

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      HAS_FTP: ${{ secrets.FTP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Secrets FTP absents
        if: env.HAS_FTP != 'true'
        run: |
          echo "::warning::Secrets FTP_SERVER, FTP_USERNAME et FTP_PASSWORD absents. Lancer ops/app-setup.sh. Rien n'a été déployé."
      - uses: shivammathur/setup-php@2.31.1
        if: env.HAS_FTP == 'true'
        with:
          php-version: '8.3'
          extensions: pdo, curl, openssl, sodium
          tools: composer:v2
      - name: Dépendances de production
        if: env.HAS_FTP == 'true'
        working-directory: web
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-progress
      - name: Synchroniser par FTPS
        if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: ./
          local-dir: ./web/
          exclude: |
            **/.git*
            **/.git*/**
            .env
            .env.example
            storage/**
            tests/**
            phpunit.xml
            .phpunit.result.cache
            composer.lock
            vitrine/**
      - name: Contrôle de santé après déploiement
        if: env.HAS_FTP == 'true'
        run: |
          # Le cache PHP d'o2switch met ~30 s à voir les nouveaux fichiers : plusieurs essais avant d'échouer.
          base="https://app.runeride.fr"
          ok=0
          for i in $(seq 1 12); do
            sante=$(curl -sS -m 15 -w ' [%{http_code}]' "$base/api/sante" || true)
            racine=$(curl -sS -m 15 -o /dev/null -w '%{http_code}' "$base/" || true)
            jwks=$(curl -sS -m 15 -o /dev/null -w '%{http_code}' "$base/.well-known/jwks.json" || true)
            echo "essai $i : sante=$sante racine=$racine jwks=$jwks"
            if [[ "$sante" == *'"statut":"ok"'*'[200]' && "$racine" == "200" && "$jwks" == "200" ]]; then ok=1; break; fi
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Le site ne répond pas correctement après le déploiement (voir les essais ci-dessus). Un 500 sur /api/sante après un envoi incrémental vient souvent d'un vendor/ mélangé entre deux déploiements : supprimer ~/app/.ftp-deploy-sync-state.json sur le serveur puis relancer ce workflow pour un envoi complet (ops/README.md)."
            exit 1
          fi
